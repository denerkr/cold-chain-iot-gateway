# Local broker for Node-RED and the Wokwi-to-public-broker bridge.
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/

# Wokwi's free public gateway cannot reach this local broker directly.
# Subscribe only to this project's namespace on the shared HiveMQ demo broker.
connection cold-chain-public-demo
address broker.hivemq.com:1883
remote_clientid ccgw-dk-hb-mosquitto-bridge
bridge_protocol_version mqttv311
try_private false
notifications false
cleansession true
restart_timeout 5 30
topic cold-chain/esp32-ccgw-dk-hb/# in 1
