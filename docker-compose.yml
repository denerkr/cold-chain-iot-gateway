services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  node-red:
    build:
      context: ./node-red
    image: cold-chain-node-red:local
    depends_on:
      - mosquitto
    ports:
      - "127.0.0.1:1880:1880"
    volumes:
      - node-red-data:/data
      - ./node-red/flows.json:/data/flows.json
    environment:
      - TZ=America/Sao_Paulo
      - FLOWS=flows.json
    restart: unless-stopped

volumes:
  mosquitto-data:
  node-red-data:
